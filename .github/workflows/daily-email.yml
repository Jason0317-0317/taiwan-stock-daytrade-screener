name: Daily Email Report

on:
  schedule:
    # Sunday-Thursday 20:00 UTC = Monday-Friday 04:00 Asia/Taipei.
    # GitHub may disable scheduled workflows in public repos after prolonged repo inactivity.
    - cron: "0 20 * * 0-4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-stock-email-report
  cancel-in-progress: false

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate stock report
        id: generate
        run: python main.py

      - name: Send daily report email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.generate.outputs.report_status == 'error' && '台股報告資料異常' || '台股隔日當沖候選分析報告' }}
          to: ${{ secrets.MAIL_TO }}
          from: Taiwan Stock Quant Bot <${{ secrets.MAIL_USERNAME }}>
          html_body: file://report.html
          body: |
            台股隔日當沖候選分析報告已完成。若郵件系統無法顯示 HTML，請下載附件查看前 10 名詳細資料。
          attachments: final_rankings.csv,report.html

      # If installation, data download, or report generation fails before the normal
      # email step, send a separate alert with a direct link to this Actions run.
      - name: Send workflow failure alert
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "【台股當沖篩選器故障】GitHub Actions 執行失敗"
          to: ${{ secrets.MAIL_TO }}
          from: Taiwan Stock Quant Bot <${{ secrets.MAIL_USERNAME }}>
          body: |
            台股隔日當沖篩選器本次執行失敗，未能正常完成每日報告。
            執行紀錄：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            請開啟執行紀錄查看失敗步驟與錯誤訊息。
